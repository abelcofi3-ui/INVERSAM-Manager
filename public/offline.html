<!doctype html>
<html lang="es-HN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1e4a" />
    <title>Sin conexión · INVERSAM</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1e4a; color: #fff;
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
      .card { max-width: 380px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #bfd3fe; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      button { background: #3b66f5; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión a internet</h1>
      <p>INVERSAM Manager necesita internet para mostrar datos actualizados del taller. Verifique la conexión e intente de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
    <script>window.addEventListener("online", () => location.reload());</script>
  </body>
</html>
